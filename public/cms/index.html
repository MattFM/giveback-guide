<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Sveltia CMS</title>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      CMS.registerEditorComponent({
        id: 'text-ad',
        label: 'Text Ad',
        icon: 'campaign',
        fields: [
          { name: 'format', label: 'Format', widget: 'select', options: ['inline', 'sidebar'], default: 'inline' },
        ],
        pattern: /^<TextAd format="(?<format>.*?)" \/>$/m,
        fromBlock: ({ groups: { format } = {} }) => ({ format: format || 'inline' }),
        toBlock: ({ format = 'inline' }) => `<TextAd format="${format}" />`,
        toPreview: ({ format = 'inline' }) => `<div style="padding: 1em; border: 1px solid #e5e7eb; border-radius: 0.5rem; background: #f9fafb;"><strong>Text Ad</strong><br>Format: ${format}</div>`,
      });

      CMS.registerEditorComponent({
        id: 'support-cta',
        label: 'Support CTA',
        icon: 'favorite',
        fields: [],
        pattern: /^<SupportCTA \/>$/m,
        toBlock: () => '<SupportCTA />',
        toPreview: () => '<div style="padding: 1em; border: 1px solid #e5e7eb; border-radius: 0.5rem; background: #f9fafb;"><strong>Support CTA</strong><br>Donation callout will appear here.</div>',
      });

      CMS.registerEditorComponent({
        id: 'listing-embed',
        label: 'Listing Embed',
        icon: 'link',
        fields: [
          { name: 'url', label: 'Listing URL', widget: 'string', required: true },
        ],
        pattern: /^<ListingEmbed url="(?<url>.*?)" \/>$/m,
        toBlock: ({ url = '' }) => `<ListingEmbed url="${url}" />`,
        toPreview: ({ url = '' }) => `<div style="padding: 1em; border: 1px solid #e5e7eb; border-radius: 0.5rem; background: #f9fafb;"><strong>Listing Embed</strong><br>URL: ${url}</div>`,
      });

      CMS.registerEditorComponent({
        id: 'button',
        label: 'Button',
        icon: 'smart_button',
        fields: [
          { name: 'label', label: 'Label', widget: 'string', required: true },
          { name: 'href', label: 'Link URL', widget: 'string', required: true },
          { name: 'variant', label: 'Variant', widget: 'select', options: ['default', 'outline', 'secondary', 'ghost', 'link', 'destructive', 'success', 'warning', 'info'], default: 'default' },
          { name: 'size', label: 'Size', widget: 'select', options: ['xs', 'sm', 'default', 'lg', 'xl'], default: 'default' },
        ],
        pattern: /^<Button href="(?<href>.*?)" variant="(?<variant>.*?)" size="(?<size>.*?)">(?<label>[\s\S]*?)<\/Button>$/m,
        fromBlock: ({ groups: { href, variant, size, label } = {} }) => ({ href: href || '', variant: variant || 'default', size: size || 'default', label: label || '' }),
        toBlock: ({ label, href, variant = 'default', size = 'default' }) => `<Button href="${href}" variant="${variant}" size="${size}">${label}</Button>`,
        toPreview: ({ label, href, variant = 'default', size = 'default' }) => {
          const styles = {
            default: 'background: #18181b; color: white;',
            outline: 'background: white; color: #18181b; border: 1px solid #e4e4e7;',
            secondary: 'background: #f4f4f5; color: #18181b;',
            ghost: 'background: transparent; color: #18181b;',
            link: 'background: transparent; color: #2563eb; text-decoration: underline;',
            destructive: 'background: #fef2f2; color: #ef4444;',
            success: 'background: #f0fdf4; color: #22c55e;',
            warning: 'background: #fefce8; color: #eab308;',
            info: 'background: #eff6ff; color: #3b82f6;',
          };
          const sizeStyles = {
            xs: 'padding: 0.25rem 0.625rem; font-size: 0.75rem;',
            sm: 'padding: 0.375rem 0.75rem; font-size: 0.75rem;',
            default: 'padding: 0.5rem 1rem; font-size: 0.875rem;',
            lg: 'padding: 0.625rem 1.5rem; font-size: 1rem;',
            xl: 'padding: 0.75rem 2rem; font-size: 1.125rem;',
          };
          return `<div style="display: inline-block; ${styles[variant] || styles.default} ${sizeStyles[size] || sizeStyles.default} border-radius: 0.375rem; font-weight: 500; cursor: pointer; font-family: system-ui, -apple-system, sans-serif;">${label}</div>`;
        },
      });

      CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          const collection = entry.get('collection');
          if (collection !== 'blog') return;

          const today = new Date().toISOString().split('T')[0];
          return entry.get('data').set('lastUpdated', today);
        },
      });
    </script>
  </body>
</html>
