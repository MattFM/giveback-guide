name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Secrets
        run: |
          echo "Checking if secrets are available:"
          if [ -n "${{ secrets.NOTION_TOKEN }}" ]; then
            echo "NOTION_TOKEN is set"
            echo "Token length: ${#NOTION_TOKEN}"
            echo "Token starts with: ${NOTION_TOKEN:0:6}..."
          else
            echo "NOTION_TOKEN is NOT set"
          fi
          echo "PROJECTS_NOTION_DATABASE_ID exists: ${{ secrets.PROJECTS_NOTION_DATABASE_ID != '' }}"
          echo "BLOG_NOTION_DATABASE_ID exists: ${{ secrets.BLOG_NOTION_DATABASE_ID != '' }}"
          echo "STAYS_NOTION_DATABASE_ID exists: ${{ secrets.STAYS_NOTION_DATABASE_ID != '' }}"

      - name: Restore Astro content store
        id: cache-content
        uses: actions/cache@v4
        with:
          path: |
            .astro/content.db
            .astro/data-store.json
          key: astro-content-db-${{ hashFiles('src/content.config.ts', 'src/lib/notion-loader.ts', 'astro.config.mjs', 'package.json') }}
          restore-keys: |
            astro-content-db-

      - name: Verify PUBLIC env (fail fast)
        env:
          PUBLIC_POCKETBASE_URL: ${{ vars.PUBLIC_POCKETBASE_URL }}
          PUBLIC_WORKER_URL: ${{ vars.PUBLIC_WORKER_URL }}
        run: |
          test -n "$PUBLIC_POCKETBASE_URL" || (echo "Missing PUBLIC_POCKETBASE_URL" && exit 1)
          test -n "$PUBLIC_WORKER_URL" || (echo "Missing PUBLIC_WORKER_URL" && exit 1)

      - name: Build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PROJECTS_NOTION_DATABASE_ID: ${{ secrets.PROJECTS_NOTION_DATABASE_ID }}
          BLOG_NOTION_DATABASE_ID: ${{ secrets.BLOG_NOTION_DATABASE_ID }}
          STAYS_NOTION_DATABASE_ID: ${{ secrets.STAYS_NOTION_DATABASE_ID }}
          PUBLIC_POCKETBASE_URL: ${{ vars.PUBLIC_POCKETBASE_URL }}
          PUBLIC_WORKER_URL: ${{ vars.PUBLIC_WORKER_URL }}
        run: pnpm run build

      - name: Update Wrangler
        run: pnpm add -g wrangler@latest

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
